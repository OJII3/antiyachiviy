[project]
name = "yachigravity-agent"
version = "0.1.0"
description = "Python Antigravity SDK worker for Yachigravity"
requires-python = ">=3.12"
dependencies = ["google-antigravity>=0.1.17,<0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yachigravity_agent"]
